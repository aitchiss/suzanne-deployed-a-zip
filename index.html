<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link data-testid="hello" rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="brand" href="./" aria-label="Home Page">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 3v26M3 16h26M6.8 6.8l18.4 18.4M6.8 25.2 25.2 6.8" stroke="currentColor" stroke-width="4" />
          </svg>
          <span>Home Page<span class="brand-period">.</span></span>
        </a>
        <span class="header-note"><span class="status-dot"></span>A little space on the web</span>
      </header>

      <main class="content">
        <section class="intro" aria-labelledby="greeting">
          <p class="eyebrow"><span></span>GOOD TO SEE YOU HERE</p>
          <h1 id="greeting">hello<br /><span>world!!!!!</span></h1>
          <p class="description">blablablablabla</p>
          <button class="hello-button" type="button" id="hello-button">
            <span>wooooo clickdafdafda me <span class="button-aside">or don't whatever</span></span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <p class="response" id="hello-response" role="status"></p>
        </section>

        <div class="artwork" aria-hidden="true">
          <div class="artwork-top"><span>A SIMPLE BEGINNING</span><span class="artwork-plus">+</span></div>
          <svg class="orbital" viewBox="0 0 480 480" fill="none">
            <defs>
              <radialGradient id="sphere" cx="0.3" cy="0.22" r="0.8">
                <stop stop-color="#b1cde2" />
                <stop offset="0.55" stop-color="#6d98bc" />
                <stop offset="1" stop-color="#365f86" />
              </radialGradient>
            </defs>
            <circle class="orbit-track" cx="240" cy="240" r="182" stroke="#b4c8d9" stroke-width="1" stroke-dasharray="2 7" />
            <g class="orbit-system">
              <ellipse cx="240" cy="240" rx="203" ry="76" transform="rotate(-40 240 240)" stroke="#6c89a3" stroke-width="1.2" />
              <ellipse cx="240" cy="240" rx="203" ry="76" transform="rotate(40 240 240)" stroke="#6c89a3" stroke-width="1.2" />
              <circle cx="240" cy="240" r="112" fill="url(#sphere)" />
              <path d="M87 347c45 12 120-12 202-81 69-58 112-115 112-143" stroke="#d9e7f2" stroke-width="1.5" />
              <path d="M87 133c45-12 120 12 202 81 69 58 112 115 112 143" stroke="#d9e7f2" stroke-width="1.5" />
              <circle cx="91" cy="339" r="12" fill="#2b5378" />
              <circle cx="378" cy="135" r="6" fill="#f6f5f0" stroke="#6c89a3" stroke-width="1.5" />
            </g>
            <path d="M382 368v20m-10-10h20" stroke="#6c89a3" stroke-width="1.5" />
            <circle cx="98" cy="118" r="3" fill="#6c89a3" />
          </svg>
          <div class="artwork-bottom"><span>A WORLD OF POSSIBILITIES.</span><span>01 — ∞</span></div>
        </div>
      </main>

      <footer class="footer">
        <span>Small page. Big possibilities.</span>
        <span class="footer-signoff">Made for a fresh start <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v14M3 10h14M5 5l10 10M5 15 15 5" stroke="currentColor" stroke-width="1.5" /></svg></span>
      </footer>
    </div>
    <script>
      const button = document.getElementById('hello-button');
      const artwork = document.querySelector('.artwork');
      const response = document.getElementById('hello-response');
      button.addEventListener('click', () => {
        response.textContent = 'hello right back at you.';
        artwork.classList.remove('is-greeting');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => artwork.classList.add('is-greeting'));
        });
      });
    </script>
  </body>
</html>
